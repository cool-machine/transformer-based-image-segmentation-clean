name: Deploy AWS Lambda API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aws_lambda/**"
      - ".github/workflows/deploy-aws-lambda.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ocp8-aws-lambda
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ocp8-segmentation
  LAMBDA_FUNCTION: ocp8-segmentation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE_URI" aws_lambda
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy image through the OCP8 CloudFormation stack
        run: |
          aws cloudformation update-stack \
            --stack-name ocp8 \
            --use-previous-template \
            --parameters ParameterKey=ImageUri,ParameterValue="$IMAGE_URI" \
            --capabilities CAPABILITY_NAMED_IAM >/dev/null
          aws cloudformation wait stack-update-complete --stack-name ocp8
          aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query FunctionUrl \
            --output text
